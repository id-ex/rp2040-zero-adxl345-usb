# RP2040-Zero + ADXL345 (GY-291), software SPI.
# Replace the serial path and verify probe coordinates before enabling.
[mcu adxl]
serial: /dev/serial/by-id/usb-Klipper_rp2040_REPLACE_WITH_YOUR_ID-if00

[adxl345]
cs_pin: adxl:gpio29
spi_software_sclk_pin: adxl:gpio14
spi_software_mosi_pin: adxl:gpio15
spi_software_miso_pin: adxl:gpio26
# axes_map: x, y, z

[resonance_tester]
accel_chip: adxl345
probe_points:
    117.5, 117.5, 20
